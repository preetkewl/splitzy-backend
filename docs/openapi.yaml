  # ── DELETE /expenses/:expenseId ─────────────────────────────────────────────

  /expenses/{expenseId}:
    delete:
      tags: [Expenses]
      operationId: deleteExpense
      summary: Soft-delete an expense
      description: |
        Marks an expense as deleted. Only the expense creator may delete it.
        Historical data (shares, balances at time of creation) is preserved in
        the database — `deletedAt` is set but the row is not removed.
      parameters:
        - name: expenseId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '204':
          description: Expense deleted. No response body.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ── GET /trips/:tripId/expenses ─────────────────────────────────────────────

  /trips/{tripId}/expenses:
    get:
      tags: [Expenses]
      operationId: listExpenses
      summary: List expenses for a trip (paginated)
      description: |
        Returns a paginated list of non-deleted expenses for the given trip,
        ordered by `spentAt DESC` then `createdAt DESC`.
        The caller must be a trip member.
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated expense list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Expense'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
              example:
                success: true
                meta:
                  page: 1
                  pageSize: 20
                  total: 5
                data:
                  - id: "e1a2b3c4-0001-0000-0000-000000000000"
                    tripId: "c3d9f2a1-4b5e-4f8c-9d0e-1a2b3c4d5e6f"
                    title: "Team lunch"
                    amountPaise: 120000
                    category: FOOD
                    splitType: EQUAL
                    paidBy:
                      userId: "user-a-uuid"
                      name: "Anjali Sharma"
                      avatarColor: "#4A90D9"
                      avatarUrl: null
                    participants:
                      - userId: "user-a-uuid"
                        name: "Anjali Sharma"
                        avatarColor: "#4A90D9"
                        avatarUrl: null
                        sharePaise: 40000
                        basisPoints: null
                        shareUnits: null
                        exactAmountPaise: null
                    splitMeta: null
                    spentAt: "2026-05-26T13:00:00.000Z"
                    createdAt: "2026-05-26T14:12:33.000Z"
                    updatedAt: "2026-05-26T14:12:33.000Z"
                    canDelete: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ── GET /trips/:tripId/balances ─────────────────────────────────────────────

  /trips/{tripId}/balances:
    get:
      tags: [Balances]
      operationId: getTripBalances
      summary: Get balance summary for a trip
      description: |
        Returns the current balance state for all members of a trip, including
        the payer credit, participant debts, net per-user balance, and a
        minimum-transfer debt simplification (suggested settlements).

        The balance engine is split-type-agnostic: it reads only `sharePaise`,
        which is always present regardless of how the expense was split. This
        means EQUAL, EXACT, PERCENT, and SHARES expenses are all handled
        identically by the engine — only the `sharePaise` values differ.

        Completed settlements are applied before suggesting new transfers.
        Former trip members (who have since left) appear in the balance list
        with `isCurrentMember: false` if they have outstanding balances.
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Balance summary for the trip.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BalanceSummary'
              example:
                success: true
                data:
                  totalAmountPaise: 570000
                  totalReimbursedPaise: 0
                  members:
                    - userId: "user-a-uuid"
                      name: "Anjali Sharma"
                      avatarColor: "#4A90D9"
                      avatarUrl: null
                      netPaise: 152500
                      totalPaidPaise: 450000
                      totalSharePaise: 297500
                      isCurrentMember: true
                    - userId: "user-b-uuid"
                      name: "Rohan Mehta"
                      avatarColor: "#E84393"
                      avatarUrl: null
                      netPaise: -76250
                      totalPaidPaise: 120000
                      totalSharePaise: 196250
                      isCurrentMember: true
                    - userId: "user-c-uuid"
                      name: "Priya Patel"
                      avatarColor: "#27AE60"
                      avatarUrl: null
                      netPaise: -76250
                      totalPaidPaise: 0
                      totalSharePaise: 76250
                      isCurrentMember: true
                  suggestedTransfers:
                    - fromUserId: "user-b-uuid"
                      toUserId: "user-a-uuid"
                      amountPaise: 76250
                    - fromUserId: "user-c-uuid"
                      toUserId: "user-a-uuid"
                      amountPaise: 76250
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
