# Production-shaped Docker Compose.
#
# In a real deployment you'd more likely run the API on PM2/systemd
# behind nginx and use a managed Postgres. This file is the path of
# least resistance for a single-VPS deployment + a quick sanity check
# that the multi-stage build still boots end-to-end.
#
# Differences from docker-compose.yml (dev):
#   - api builds from `Dockerfile` (multi-stage, prod target)
#   - reads from `.env.production` (committed template; secrets injected
#     by your platform of choice — never check the live file in)
#   - postgres data lives on a dedicated, named volume + healthcheck
#     gates `api` startup
#   - api restart policy is unless-stopped
#   - container ports bind to localhost only — front by nginx for TLS

services:
  postgres:
    image: postgres:16-alpine
    container_name: splitzy-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-splitzy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-splitzy}
    volumes:
      - splitzy-pgdata-prod:/var/lib/postgresql/data
    # Bind to localhost only — front via private VPC or nginx for SSH tunneling.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-splitzy} -d ${POSTGRES_DB:-splitzy}']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Plumb through to the runtime image's SERVICE_VERSION env var
        # so /health surfaces a real version string.
        SERVICE_VERSION: ${SERVICE_VERSION:-unknown}
    image: splitzy-backend:prod
    container_name: splitzy-api-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      # These override the env_file when both are present. Useful for
      # injecting platform-managed secrets without committing them.
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    # Bind only to localhost — TLS termination is nginx's job.
    ports:
      - '127.0.0.1:4000:4000'
    healthcheck:
      # Same shape as the LB probe — exercises the full stack including DB.
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  splitzy-pgdata-prod:
